title=Resumable upload to a resource
explanation=<p>Each file goes to a <em>mounted resource</em> in chunks of 1 MB, over the open <a href="https://tus.io/protocols/resumable-upload">tus protocol</a>.</p> <p>Pause, resume or cancel each upload, or all of them at once. Two files are sent at the same time, the others wait.</p> <p>When the connection breaks off, the upload goes on by itself from where the server got, once the browser is online again. Reload the page and choose the same file again: the upload goes on from where it was.</p> <p>Once a file is whole it is stored by the same file manager as the other upload to a resource, and the page hears of it the same way.</p>
order=4
